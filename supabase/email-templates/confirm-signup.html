<!--
  DramStory — Confirm signup template (5 September 2026)
  Supabase → Authentication → Emails → Confirm signup

  Subject line to set alongside it:  Confirm your DramStory account

  WHY THIS EXISTS SEPARATELY FROM MAGIC LINK. Supabase sends this one the
  FIRST time an address is used and the magic-link template every time
  after. Brand only one and half your visitors get the unbranded default
  — which is how Mark first saw "Supabase Auth <noreply@mail.app.supabase.io>".

  Same restraint as the magic-link template, and for the same reason:
  Supabase's deliverability guidance says keep authentication email free
  of marketing language, taglines, extra links and images, because spam
  filters read those as promotional and an auth email in spam locks
  someone out. Brand carried by colour, type and sender name only.

  Table layout and inline styles because email clients are twenty years
  behind browsers. Georgia rather than Cormorant Garamond because web
  fonts do not load in most of them.
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#F5F1E8;padding:32px 16px;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background-color:#ffffff;border-radius:8px;padding:36px 32px;">
        <tr>
          <td style="font-family:Georgia,'Times New Roman',serif;font-size:22px;font-weight:600;color:#1A3A4A;padding-bottom:8px;">
            DramStory
          </td>
        </tr>
        <tr>
          <td style="font-family:Georgia,'Times New Roman',serif;font-size:19px;color:#1A3A4A;padding-bottom:16px;line-height:1.3;">
            Confirm your email
          </td>
        </tr>
        <tr>
          <td style="font-family:Helvetica,Arial,sans-serif;font-size:15px;line-height:1.6;color:#4A4A44;padding-bottom:24px;">
            Confirm this address to finish setting up your account. The link works once and expires in an hour.
          </td>
        </tr>
        <tr>
          <td align="center" style="padding-bottom:24px;">
            <a href="{{ .ConfirmationURL }}"
               style="display:inline-block;background-color:#1A3A4A;color:#ffffff;font-family:Helvetica,Arial,sans-serif;font-size:15px;font-weight:600;text-decoration:none;padding:13px 30px;border-radius:100px;">
              Confirm email address
            </a>
          </td>
        </tr>
        <tr>
          <td style="font-family:Helvetica,Arial,sans-serif;font-size:13px;line-height:1.6;color:#7A7A72;border-top:1px solid #E8E2D6;padding-top:18px;">
            If you didn&rsquo;t ask for this, you can ignore it — nothing will happen and no account is created.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
