<!--
  DramStory — Magic Link template (5 September 2026)
  Supabase → Authentication → Emails → Magic Link

  Subject line to set alongside it:  Your DramStory sign-in link

  DELIBERATELY PLAIN, and that is not laziness. Supabase's own
  deliverability guidance for authentication email is explicit: no
  marketing language, no taglines, no "what this product is", few links,
  few images. Spam filters classify that content as marketing, and an
  auth email in a spam folder means the person simply cannot get in.

  So this carries the brand through colour, type and sender name only.
  The DramStory voice belongs in the newsletter, not here.

  Table-based layout and inline styles because email clients are twenty
  years behind browsers - Outlook still renders with Word's engine, and
  <div> plus a stylesheet is not reliable. Georgia rather than the
  brand's Cormorant Garamond: web fonts do not load in most email
  clients, and Georgia is the closest serif that is actually installed
  everywhere.
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#F5F1E8;padding:32px 16px;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background-color:#ffffff;border-radius:8px;padding:36px 32px;">
        <tr>
          <td style="font-family:Georgia,'Times New Roman',serif;font-size:22px;font-weight:600;color:#1A3A4A;padding-bottom:8px;">
            DramStory
          </td>
        </tr>
        <tr>
          <td style="font-family:Georgia,'Times New Roman',serif;font-size:19px;color:#1A3A4A;padding-bottom:16px;line-height:1.3;">
            Your sign-in link
          </td>
        </tr>
        <tr>
          <td style="font-family:Helvetica,Arial,sans-serif;font-size:15px;line-height:1.6;color:#4A4A44;padding-bottom:24px;">
            Use the button below to sign in. It works once and expires in an hour.
          </td>
        </tr>
        <tr>
          <td align="center" style="padding-bottom:24px;">
            <a href="{{ .ConfirmationURL }}"
               style="display:inline-block;background-color:#1A3A4A;color:#ffffff;font-family:Helvetica,Arial,sans-serif;font-size:15px;font-weight:600;text-decoration:none;padding:13px 30px;border-radius:100px;">
              Sign in to DramStory
            </a>
          </td>
        </tr>
        <tr>
          <td style="font-family:Helvetica,Arial,sans-serif;font-size:13px;line-height:1.6;color:#7A7A72;border-top:1px solid #E8E2D6;padding-top:18px;">
            If you didn&rsquo;t ask for this, you can ignore it — nothing will happen and no account is created.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
